name: Publish to PyPI and GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    # brags/bin/server_executable (built below) is a native binary bundled
    # straight into the wheel, but a plain `poetry build` always produces a
    # py3-none-any wheel -- which claims to run on every platform even
    # though the binary inside only runs on whatever OS/arch built it. That
    # previously meant `pip install brags` succeeded everywhere but `brags
    # init` (which subprocess.Popen's this binary) crashed on anything but
    # the linux/amd64 GitHub runner that built the release.
    #
    # The Go module has no cgo (no `import "C"`, all deps are pure Go), so
    # CGO_ENABLED=0 cross-compiles a fully static binary for each target
    # from this single Linux runner -- no per-platform C toolchain or
    # native runner needed. Each leg then relabels its wheel's platform tag
    # (poetry-core has no concept of "this pure-Python-looking wheel
    # actually only works on macosx_11_0_arm64") with the `wheel tags` CLI,
    # so pip picks the right one for each user's platform automatically.
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            wheel_tag: manylinux2014_x86_64
            build_sdist: true
          - goos: linux
            goarch: arm64
            wheel_tag: manylinux2014_aarch64
            build_sdist: false
          - goos: darwin
            goarch: amd64
            wheel_tag: macosx_10_15_x86_64
            build_sdist: false
          - goos: darwin
            goarch: arm64
            wheel_tag: macosx_11_0_arm64
            build_sdist: false
          - goos: windows
            goarch: amd64
            wheel_tag: win_amd64
            build_sdist: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        uses: snok/install-poetry@v1.4.1
        with:
          version: 1.5.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Go binary for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd go
          chmod +x build.sh
          ./build.sh

      - name: Set package version from tag
        # pyproject.toml's `version` field was previously maintained by hand
        # and repeatedly drifted out of sync with the pushed git tag (e.g.
        # tags v0.0.6 through v0.0.9 all left version = "0.0.4", which
        # v0.0.5 had already published) -- PyPI permanently rejects
        # re-uploading a version that already exists, so most releases
        # failed at the publish step with "File already exists". Deriving
        # the version from the tag makes the tag the single source of
        # truth and removes the manual-sync step entirely.
        run: poetry version "${GITHUB_REF_NAME#v}"

      - name: Build wheel
        run: poetry build --format wheel

      - name: Build sdist
        # Only one leg needs to produce the source distribution -- it's
        # platform-independent, so building it in every matrix leg would
        # just create duplicate dist/*.tar.gz files that collide once all
        # artifacts are merged for publishing.
        if: matrix.build_sdist
        run: poetry build --format sdist

      - name: Tag wheel as ${{ matrix.wheel_tag }}
        run: |
          pip install --quiet wheel
          wheel tags --python-tag py3 --abi-tag none --platform-tag ${{ matrix.wheel_tag }} --remove dist/*-py3-none-any.whl

      - name: Upload distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/brags
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # The action's actual input is `user`, not `username` -- the old
          # `username` key was silently ignored (confirmed via this job's
          # own run annotations: "Unexpected input(s) 'username', valid
          # inputs are ['user', 'password', ...]"), which disabled explicit
          # token auth on every prior release.
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Defense in depth alongside the tag-driven versioning above: if a
          # version is ever re-uploaded by accident, skip it instead of
          # hard-failing the whole release (and blocking the GitHub Release
          # step, which only runs after this one succeeds).
          skip-existing: true

  github-release:
    name: GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} dist/* \
            --repo ${{ github.repository }} \
            --title "Release ${{ github.ref_name }}" \
            --notes "Release Notes for ${{ github.ref_name }}"
