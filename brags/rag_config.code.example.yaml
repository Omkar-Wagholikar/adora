# === RAG CONFIGURATION FILE: CODE RETRIEVAL PROFILE ===
#
# Tuned for indexing and searching a codebase (as opposed to prose/PDF
# documents -- see rag_config.example.yaml for that profile). Copy this to
# rag_config.yaml (or point --config at it directly) before running
# `brags ingest --docs /path/to/repo` and `brags mcp` / `brags query`.
#
# Needs the "code" extra for chunking.splitter: code, and (if reranking is
# left enabled, as below) sentence-transformers' CrossEncoder -- already a
# base dependency, no extra needed for that part:
#   pip install "brags[code]"

llm:
  provider: "gemini"  # Options: gemini, ollama
  model_name: "gemini-2.0-flash"
  temperature: 0.2  # Lower than the prose default -- code Q&A wants precise, literal answers, not creative phrasing.
  max_tokens: 1024

  api_keys:
    gemini_api_key: API_KEY

  ollama_host: "http://localhost:11434"

# ----------------------------
# EMBEDDING CONFIGURATION
# ----------------------------
embedding:
  # "ensemble" (dense + BM25/TF-IDF) rather than plain "huggingface": code
  # search leans heavily on exact identifier/symbol matches ("find calls to
  # EmbeddingFactory.create"), which BM25 keyword matching catches far more
  # reliably than dense embeddings alone -- dense embeddings are tuned on
  # natural-language prose and don't represent camelCase/snake_case
  # identifiers or operators well. Needs the "ensemble" extra:
  #   pip install "brags[ensemble]"
  provider: "ensemble"
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  dimensions: 384
  normalize: true
  ensemble_weights:
    vector: 0.5
    bm25: 0.3
    tfidf: 0.2
  bm25_enabled: true

# ----------------------------
# VECTOR STORE CONFIGURATION
# ----------------------------
vector_store:
  type: "faiss"  # Options: faiss, chroma
  persist_path: "./code_vector_db"
  similarity_metric: "cosine"
  # Lower than the prose default (5): code_chunker already produces one
  # focused chunk per function/method, so each hit carries more relevant
  # signal than a prose chunk does -- fewer, more precise results.
  top_k: 4
  allow_dangerous_deserialization: false
  save_if_not_local: true

# ----------------------------
# DOCUMENT CHUNKING CONFIGURATION
# ----------------------------
chunking:
  # chunk_size/chunk_overlap are only used as a fallback for files with no
  # recognized definitions (config files, tiny scripts) -- code mode chunks
  # by function/class/method boundary via tree-sitter, not by token count.
  chunk_size: 1500
  chunk_overlap: 100
  splitter: "code"
  # None = auto-detect each file's language from its extension. Restrict to
  # a subset if you only want specific languages indexed, e.g.:
  # languages: ["python", "go"]
  languages: null

# ----------------------------
# RERANKING
# ----------------------------
reranking:
  # Recommended on for code: a cross-encoder reranking pass over the
  # over-fetched candidates below is usually the single biggest retrieval
  # quality lever after chunking itself. Uses sentence-transformers'
  # CrossEncoder -- already a base dependency, no extra install needed.
  enabled: true
  provider: "cross_encoder"
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 4
  fetch_multiplier: 4  # fetches top_k * 4 = 16 candidates from the vector store before reranking down to top_k

# ----------------------------
# HALLUCINATION CHECKER
# ----------------------------
hallucination_checker:
  enabled: false
  same_as_retriever: true
  method: "embedding_similarity"

# ----------------------------
# LOGGING / MONITORING
# ----------------------------
logging:
  level: "info"
  # false, not true: `brags mcp` runs as a stdio MCP server where stdout is
  # the protocol channel. Logging itself already goes to stderr regardless
  # (see logging_setup.py), but there's no reason to also write a log file
  # by default here -- flip to true if you want one for `brags ingest`/
  # `brags query` runs.
  log_to_file: false
  log_file_path: "./rag_logs.log"

# ----------------------------
# OTHER SETTINGS
# ----------------------------
rag_mode: "stuff"
streaming: false
use_cache: true
debug: false
