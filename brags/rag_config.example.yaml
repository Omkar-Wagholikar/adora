# === RAG CONFIGURATION FILE ===
#
# This profile is tuned for prose/PDF document retrieval (the original use
# case). For indexing and searching a codebase instead, start from
# rag_config.code.example.yaml -- code retrieval wants different chunking,
# embeddings, and reranking settings than prose does; see that file's
# comments for why each setting differs.

# ----------------------------
# MODEL CONFIGURATION
# ----------------------------
llm:
  provider: "gemini"  # Options: gemini, ollama, claude, openai
  model_name: "gemini-2.0-flash"  # Example: gemini-2.0-flash (gemini), llama3 (ollama), claude-sonnet-5 (claude), gpt-5.6 (openai)
  temperature: 0.7
  max_tokens: 1024

  # openai_api_key/gemini_api_key/anthropic_api_key are all optional -- if
  # omitted (or left as this placeholder), the underlying SDK falls back to
  # reading OPENAI_API_KEY/GEMINI_API_KEY/ANTHROPIC_API_KEY from the
  # environment automatically. The "claude" provider uses the
  # anthropic_api_key entry (matching ANTHROPIC_API_KEY, the env var it
  # actually falls back to), not a "claude_api_key" entry.
  api_keys:
    openai_api_key: API_KEY
    gemini_api_key: API_KEY
    anthropic_api_key: API_KEY

  # Only needed if provider is huggingface
  huggingface_api_token: HF_TOKEN

  # Only needed if provider is ollama
  ollama_host: "http://localhost:11434"  # Default local Ollama server

# ----------------------------
# EMBEDDING CONFIGURATION
# ----------------------------
embedding:
  provider: "huggingface"  # Options: huggingface (dense only), ensemble (dense + BM25/TF-IDF/LDA -- needs the "ensemble" extra, see README)
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  dimensions: 384
  normalize: true
  # ensemble_weights:
  #       - vector': 0.4
  #       - tfidf': 0.3
  #       - lda': 0.2
  #       - bm25': 0.1
  # cache_dir: "./ensemble_cache"
  # tfidf_config:
  #     - max_features: 10000
  #     - stop_words: 'english'
  #     - ngram_range: (1, 2)
  #     - min_df: 2
  #     - max_df: 0.8

  # lda_config:
  #     - num_topics: 15
  #     - passes: 10
  #     - random_state: 42
  #     - alpha: 'auto'
  
  # bm25_enabled: true
# ----------------------------
# VECTOR STORE CONFIGURATION
# ----------------------------
vector_store:
  type: "faiss"  # Options: faiss, chroma
  persist_path: "./vector_db"
  similarity_metric: "cosine"
  top_k: 5
  # FAISS.load_local() uses pickle under the hood; setting this true lets a
  # tampered or untrusted index.pkl execute arbitrary code when loaded.
  # Only enable it if you trust the source of every file under persist_path.
  allow_dangerous_deserialization: false
  save_if_not_local: false
# ----------------------------
# DOCUMENT CHUNKING CONFIGURATION
# ----------------------------
chunking:
  chunk_size: 500
  chunk_overlap: 50
  splitter: "semantic"  # "semantic" (embedding-similarity chunking, for prose/PDF) or "code" (tree-sitter, syntax-aware -- see rag_config.code.example.yaml)
  # languages: only consulted when splitter is "code"; see the code profile.

# ----------------------------
# RERANKING (Optional)
# ----------------------------
reranking:
  enabled: false
  provider: "cross_encoder"
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 3
  # Candidates over-fetched from the vector store before reranking down to
  # top_k = vector_store.top_k * fetch_multiplier.
  fetch_multiplier: 4

# ----------------------------
# HALLUCINATION CHECKER CONFIGURATION
# ----------------------------
hallucination_checker:
  enabled: true
  same_as_retriever: false
  method: "fact_checking"  # Options: embedding_similarity, fact_checking, citation_matching

  # For embedding similarity (e.g., cosine distance between answer and source)
  threshold: 0.7

  # If using LLM for fact-checking
  provider: "gemini"  # Options: gemini, ollama
  model_name: "gemini-2.0-flash"  # Example: gpt-3.5-turbo, llama3, mistral, gemini-pro, etc.
  temperature: 0.7
  max_tokens: 1024

  # Only needed if provider is openai or gemini, the value is the key in the .env file *not* the actual key
  api_keys:
    openai_api_key: API_KEY
    gemini_api_key: API_KEY

  # Only needed if provider is huggingface
  huggingface_api_token: HF_TOKEN

  # Only needed if provider is ollama
  ollama_host: "http://localhost:11434"  # Default local Ollama server

  prompt_template: |
    Given the following context and answer, check if the answer is grounded in the context. Reply only "Yes" or "No".
    
    CONTEXT:
    {context}

    ANSWER:
    {answer}

    Is the answer grounded in the context?

# ----------------------------
# LOGGING / MONITORING
# ----------------------------
logging:
  level: "info"  # debug, info, warning, error
  log_to_file: true
  log_file_path: "./rag_logs.log"

# ----------------------------
# OTHER SETTINGS
# ----------------------------
rag_mode: "stuff"  # Options: stuff, map_reduce, refine (LangChain modes)
streaming: false
use_cache: true
debug: false
