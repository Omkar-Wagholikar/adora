[tool.poetry]
name = "brags"
version = "0.0.6"
description = "Build-your-own Retrieval-Augmented Generation (RAG) system"
readme = "README.md"
authors = ["Omkar Wagholikar <omkargwagholikar@gmail.com>"]
license = "MIT"
packages = [{include = "brags"}]
include = [
    "brags/bin/*",
]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.11"
PyYAML = "^6.0"
requests = "^2.32"
langchain = "^0.3.27"
langchain-community = "^0.3.29"
langchain-core = "^0.3.75"
langchain-experimental = "^0.3.4"
langchain-google-genai = "^2.1.10"
langchain-text-splitters = "^0.3.11"
faiss-cpu = "^1.12.0"
chromadb = "^0.5"
sentence-transformers = "^5.1.0"
pdfplumber = "^0.11"

# `optional = true` here plus the [tool.poetry.extras] table below (rather
# than [tool.poetry.group.X.dependencies]) is what actually makes these
# `pip install brags[ensemble]`-installable. Poetry dependency groups are a
# poetry-workspace-only construct for `poetry install --with X` inside a
# poetry-managed checkout -- they never appear in a published wheel's
# requires_dist at all. Confirmed on the real published v0.1.5 wheel: its
# PyPI metadata has zero trace of the (pre-existing) `ensemble` group,
# meaning `pip install brags[ensemble]` has never actually worked for
# anyone installing from PyPI.
scikit-learn = {version = "^1.5", optional = true}
gensim = {version = "^4.3", optional = true}
rank-bm25 = {version = "^0.2.2", optional = true}

# Only needed for `chunking.splitter: code` -- tree-sitter-language-pack
# bundles prebuilt multi-language grammars (Python, Go, JS/TS, etc.) so we
# don't have to depend on and version-pin each per-language grammar package
# separately. The older `tree-sitter-languages` package this supersedes is
# unmaintained and doesn't have a matching build for current tree-sitter
# versions.
tree-sitter = {version = "^0.25.0", optional = true}
tree-sitter-language-pack = {version = "^1.14.0", optional = true}

# Only needed for `brags mcp` (the stdio MCP server exposing retrieval to
# MCP clients like Claude Code). Pinned below 2.0 -- that major version
# landed the same day this was written, so this targets the well-established
# 1.x API instead of a same-day major bump.
mcp = {version = "^1.29.0", optional = true}

[tool.poetry.extras]
ensemble = ["scikit-learn", "gensim", "rank-bm25"]
code = ["tree-sitter", "tree-sitter-language-pack"]
mcp = ["mcp"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
ruff = "^0.6"

[build-system]
# Upper-bounded: brags/bin/* is bundled into the wheel via the `include`
# directive above despite being .gitignore'd, and that only works because
# poetry-core ~1.6 (what Poetry 1.5.1, pinned in release.yml, resolves)
# lets an explicit `include` override VCS-ignore exclusion. Verified that
# poetry-core 2.4.1 silently drops the file with no build error instead --
# an unpinned upper bound here would let a future `pip install` resolve
# into that range and start shipping wheels with no Go binary inside them,
# with nothing in CI catching it.
requires = ["poetry-core>=1.0.0,<2.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.ruff.lint]
# Pin an explicit rule selection instead of relying on whatever a given
# ruff version's "default" happens to be: ruff 0.16.2 (what CI's fresh
# `pip install ruff` pulls) enables a much broader default set than the
# older ruff already installed locally when brags/ was cleaned up, so the
# same command produced 0 errors locally and 78 in CI. This pins to
# pyflakes + basic pycodestyle errors (ruff's long-standing classic
# default) so `ruff check brags` means the same thing everywhere.
select = ["E4", "E7", "E9", "F"]
